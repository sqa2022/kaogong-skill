name: shenlun-smoke

on:
  push:
    branches:
      - main
      - feat/shenlun-core
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run smoke test
        run: python scripts/smoke_test.py
